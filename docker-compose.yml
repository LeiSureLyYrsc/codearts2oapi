services:
  codearts2api:
    image: ghcr.io/leisurelyyrsc/codearts2oapi:latest
    pull_policy: always
    container_name: codearts2api
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      CA2A_HOST: "0.0.0.0"
      CA2A_PORT: "8787"
      CA2A_AUTH_DIR: /app/auths
      CA2A_DATA_DIR: /app/data
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
    restart: unless-stopped
