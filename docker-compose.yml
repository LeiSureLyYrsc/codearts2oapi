services:
  codearts2api:
    image: ghcr.io/leisurelyyrsc/codearts2oapi:latest
    pull_policy: always
    container_name: codearts2api
    # Run as the unprivileged app user (UID/GID 1000 in the image). Override
    # CA2A_UID/CA2A_GID in your shell or .env when the host bind dirs are
    # owned by another non-root user, so auths/ and data/ stay writable.
    user: "${CA2A_UID:-1000}:${CA2A_GID:-1000}"
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      CA2A_HOST: "0.0.0.0"
      CA2A_PORT: "8787"
      CA2A_AUTH_DIR: /app/auths
      CA2A_DATA_DIR: /app/data
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
    restart: unless-stopped
